name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'prisma/**'
      - 'package.json'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'prisma/**'
      - 'package.json'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Backend typecheck
        run: npm run typecheck -w @acme/api
      - name: Backend build
        run: npm run build -w @acme/api
      - name: Backend tests
        run: npm run test -w @acme/api
