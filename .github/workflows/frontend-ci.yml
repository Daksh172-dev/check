name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - '.github/workflows/frontend-ci.yml'

jobs:
  build-and-test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Frontend typecheck
        run: npm run typecheck -w @acme/web
      - name: Frontend build
        run: npm run build -w @acme/web
      - name: Frontend tests
        run: npm run test -w @acme/web
